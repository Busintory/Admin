<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="description" content="Admin dashboard for managing Busintory's product catalog, including products, brands, categories, and staff." />
  <meta name="keywords" content="Busintory, product catalog, admin dashboard, inventory management, brands, categories, staff management" />
  <meta name="author" content="Busintory" />
  <!-- Meta tags for SEO and responsiveness -->
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="Busintory Admin website" />
  <meta property="og:description" content="Admin dashboard for managing Busintory's product catalog, including products, brands, categories, and staff." />
  <meta property="og:image" content="https://Busintory.github.io/admin/android-chrome-192x192.png" />
  <meta property="og:url" content="https://Busintory.github.io/admin" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Busintory Admin website" />
  <meta name="twitter:description" content="Admin dashboard for managing Busintory's product catalog, including products, brands, categories, and staff." />
  <meta name="twitter:image" content="https://Busintory.github.io/admin/android-chrome-192x192.png" />
  <title>Busintory Product Catalog</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">  
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast" id="toast"></div>
<div id="update-banner" class="hidden">
  New version available.
  <button id="refresh-app">
    Refresh
  </button>
</div>

<!-- splash screen -->
<div id="splash-screen" class="splash-screen">
  <div class="splash-content">
    <div class="splash-logo">
      <img src="android-chrome-512x512.png" alt="Busintory Logo">
    </div>
  </div>
  <style>
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #043915; /* Busintory brand color */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .splash-content {
      text-align: center;
    }
    .splash-logo img {
      width: 120px;
      height: 120px;
      /* Gentle pulsing animation */
      animation: splash-pulse 1.8s infinite ease-in-out; 
    }

    @keyframes splash-pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</div>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-app-name">Busintory</div>
      <div class="login-app-sub">Product Catalog Admin</div>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
      <label for="login-email" class="form-label" >Email</label>
      <input class="form-input" id="login-email" type="email" placeholder="your@email.com"/>
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <label for="login-password" class="form-label" >Password</label>
      <input class="form-input" id="login-password" type="password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter') handleLogin()"/>
    </div>
    <button title="login" class="btn-primary" style="width:100%;justify-content:center;" onclick="handleLogin()">
      <i class="ti ti-login"></i> Sign in
    </button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen" class="app-screen hidden">

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="app-name">Busintory</div>
        <div class="app-sub">Product Catalog Admin</div>
      </div>
      <nav class="nav">
        <div class="nav-section">Main</div>
        <div class="nav-item active" onclick="showPage('dashboard')">
          <i class="ti ti-home"></i><span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="showPage('products')">
          <i class="ti ti-pill"></i><span>Products</span>
        </div>
        <div class="nav-section">Manage</div>
        <div class="nav-item" onclick="showPage('brands')">
          <i class="ti ti-building"></i><span>Brands</span>
        </div>
        <div class="nav-item" id="nav-categories" onclick="showPage('categories')">
          <i class="ti ti-tag"></i><span>Categories</span>
        </div>
        <div class="nav-item" onclick="showPage('forms')">
          <i class="ti ti-layout-list"></i><span>Forms / Variants</span>
        </div>
        <div class="nav-item" id="nav-staff" onclick="showPage('staff')">
          <i class="ti ti-users"></i><span>Staff</span>
        </div>
      </nav>
      <span id="cpright">Copyright © 2026 Busintory. All rights reserved.</span>
      <div class="sidebar-footer">
        <div class="staff-info">
          <div class="staff-name" id="staff-name">—</div>
          <div class="staff-role" id="staff-role">—</div>
        </div>
        <button title="Sign out" class="icon-btn" onclick="handleLogout()">
          <i class="ti ti-logout" style="color:rgba(255,255,255,0.5);font-size:18px;"></i>
        </button>
      </div>
    </aside>

    <!-- main content -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button title="menu" class="hamburger" onclick="openSidebar()">
            <i class="ti ti-menu-2"></i>
          </button>
          <div class="page-title" id="page-title">Dashboard</div>
        </div>
        <div class="topbar-right" id="topbar-actions"></div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading...</div>
      </div>
      <!-- <h1>version test</h1> -->

      <!-- Bottom nav (mobile only) -->
      <nav class="bottom-nav" id="bottom-nav">
        <div class="bottom-nav-item active" onclick="showPage('dashboard')">
          <i class="ti ti-home"></i>
          <span>Home</span>
        </div>
        <div class="bottom-nav-item" onclick="showPage('products')">
          <i class="ti ti-pill"></i>
          <span>Products</span>
        </div>
        <div class="bottom-nav-item" onclick="showPage('brands')">
          <i class="ti ti-building"></i>
          <span>Brands</span>
        </div>
        <div class="bottom-nav-item" onclick="showPage('categories')">
          <i class="ti ti-tag"></i>
          <span>More</span>
        </div>
      </nav>
    </div>
  </div>

</div>

<!-- Core setup -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<!-- Utilities -->
<script src="js/utils/ui.js"></script>
<script src="js/utils/dom.js"></script>
<script src="js/utils/badges.js"></script>

<!-- Page modules -->
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/products.js"></script>
<script src="js/pages/brands.js"></script>
<script src="js/pages/categories.js"></script>
<script src="js/pages/forms.js"></script>
<script src="js/pages/staff.js"></script>

<!-- Shared utilities & routing -->
<script src="js/shared.js"></script>
<script src="js/navigation.js"></script>

<!-- Main app -->
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
<script>
  if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("./service-worker.js")
      .then(registration => {

        registration.addEventListener("updatefound", () => {

          const newWorker = registration.installing;

          newWorker.addEventListener("statechange", () => {

            if (
              newWorker.state === "installed" &&
              navigator.serviceWorker.controller
            ) {

              showUpdateToast();
            }
          });
        });
        registration.update();
      });
  }
</script>
</body>
</html>
